AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Attachment Sync Lambda - JSM to Jira Software mirrored-issue attachment sync.
  Phase 3: full sync logic implemented (webhook signature verification,
  JSM Mirror link resolution, attachment download/re-upload). See
  src/handler.py, src/attachment_sync.py, src/jsm_mirror_link.py,
  src/jira_client.py, src/signature.py, src/secrets.py.

  ASSUMPTION (explicit, not verified against a user decision): this template
  uses AWS::Serverless::HttpApi (API Gateway) rather than a Lambda Function URL,
  because the source handoff doc's cost table itemizes API Gateway explicitly.
  If a Function URL is preferred instead, this is a small, isolated change
  (FunctionUrlConfig on the function replaces the HttpApi event) - flag if you
  want that swapped before Phase 2.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment; used to scope resource names and the Secrets Manager secret.

  JiraServiceAccountSecretArn:
    Type: String
    Description: >
      Full ARN of the Secrets Manager secret holding the Jira service-account API token.
      Must be created manually first (see docs/phase1-manual-steps.md) - this template
      does not create the secret's contents, only grants scoped read access to it.
    AllowedPattern: '^arn:aws:secretsmanager:[a-z0-9-]+:\d{12}:secret:.+$'
    ConstraintDescription: Must be a valid Secrets Manager secret ARN.

  JiraWebhookSigningSecretArn:
    Type: String
    Description: >
      Full ARN of the Secrets Manager secret holding the Jira webhook HMAC signing
      secret (used to verify the X-Hub-Signature header per Atlassian's documented
      WebSub-based signing scheme: https://developer.atlassian.com/cloud/jira/platform/webhooks/#secure-admin-webhooks).
      Created when registering the webhook in Phase 2 (see docs/phase2-webhook-registration.md).
    AllowedPattern: '^arn:aws:secretsmanager:[a-z0-9-]+:\d{12}:secret:.+$'
    ConstraintDescription: Must be a valid Secrets Manager secret ARN.

  JiraBaseUrl:
    Type: String
    Description: >
      Base URL of the Jira Cloud instance (no trailing slash), e.g.
      https://icxeed.atlassian.net. Not a secret - passed as a plain
      parameter/environment variable, unlike the two ARNs above.
    AllowedPattern: '^https://[a-zA-Z0-9.-]+\.atlassian\.net$'
    ConstraintDescription: Must be an https:// Atlassian Cloud URL with no trailing slash.

  AllowedProjectKeys:
    Type: String
    Default: ''
    Description: >
      Phase 5 (multi-client-pair scaling): comma-separated list of JSM
      project keys this Lambda is allowed to process, e.g. "JTT,ABB,BEE".
      Optional defense-in-depth on top of the webhook's own JQL filter -
      see docs/phase5-scaling-to-additional-pairs.md. Leave blank (default)
      to disable the check entirely, matching pre-Phase-5 behavior.

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.14
    Architectures:
      - x86_64
    Tracing: Active
    Environment:
      Variables:
        ENVIRONMENT: !Ref EnvironmentName
        JIRA_SERVICE_ACCOUNT_SECRET_ARN: !Ref JiraServiceAccountSecretArn
        JIRA_WEBHOOK_SIGNING_SECRET_ARN: !Ref JiraWebhookSigningSecretArn
        JIRA_BASE_URL: !Ref JiraBaseUrl
        ALLOWED_PROJECT_KEYS: !Ref AllowedProjectKeys

Resources:
  AttachmentSyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub attachment-sync-${EnvironmentName}
      Description: Receives Jira webhook events and syncs attachments to the linked mirror issue.
      CodeUri: ../src/
      Handler: handler.lambda_handler
      Policies:
        - Statement:
            - Sid: ReadJiraServiceAccountSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref JiraServiceAccountSecretArn
            - Sid: ReadJiraWebhookSigningSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref JiraWebhookSigningSecretArn
      Events:
        JiraWebhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref AttachmentSyncHttpApi
            Path: /webhook/jira-attachment
            Method: post

  AttachmentSyncHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref EnvironmentName
      # No CORS - this endpoint is server-to-server (Jira webhook), not browser-invoked.

  AttachmentSyncLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/attachment-sync-${EnvironmentName}
      RetentionInDays: 30

Outputs:
  WebhookEndpoint:
    Description: URL to register in Jira Settings > System > WebHooks
    Value: !Sub https://${AttachmentSyncHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}/webhook/jira-attachment

  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt AttachmentSyncFunction.Arn

  FunctionRoleArn:
    Description: IAM execution role ARN (for reference/auditing)
    Value: !GetAtt AttachmentSyncFunctionRole.Arn
