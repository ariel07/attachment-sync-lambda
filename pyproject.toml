[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# S101 - assert usage: required by pytest, not a vulnerability
# S105/S106 - "hardcoded password": fake tokens/secrets in test doubles only
# S506 - yaml.load with a custom loader: intentional, used only to parse
#   infra/template.yaml for CFN validation in test_phase1/3_infra.py
# S603 - subprocess call: invokes cfn-lint, a fixed trusted binary, not
#   untrusted/user-controlled input
"tests/*" = ["S101", "S105", "S106", "S506", "S603"]